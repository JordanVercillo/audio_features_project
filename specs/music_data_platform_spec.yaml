known_pitfalls:
  - "The dump's tab-separated files use PostgreSQL COPY escaping: \\N is null, and backslash sequences (\\t, \\n, \\\\) must be unescaped; a naive split on tab corrupts names with tabs or newlines."
  - "Cover-art tar members are schema-qualified (mbdump/cover_art_archive.cover_art); a bare table name never matches, and the ingest folder strips the prefix. A table with zero rows is omitted from the tar entirely, so absent can mean empty, not misnamed."
  - "dbt requires unique model names across the project: models/cleansed/artists.sql and models/staging/artists.sql cannot coexist. The file is <schema>__<table>.sql and config(alias) keeps the table bare; with the no-repeated-names rule the collision never arises on disk, but the file convention still holds."
  - "Integer ids and UUIDs both persist across dumps while the entity survives; merges and deletions remove rows, and <entity>_gid_redirect maps a retired musicbrainz_id to its successor. Anything that must survive a refresh (the Spotify match, the audio features) keys on <entity>_musicbrainz_id and resolves through the redirect table."
  - "dbt-spark session method opens a Derby metastore in the working directory (metastore_db/, derby.log, both gitignored); two dbt runs at once lock it, so one build at a time, one environment at a time."
  - "Until task_3's HARNESS part lands, the audit walks data/<layer>/<table>/ and compares same-named tables between adjacent layers; the new layout (environment and source levels, names that never repeat) makes that check vacuous, so the audit change ships in the same slice as the fetch, never later."
  - "A release has many dates (one per release event) and release_first_release_date is not exported; derive first_release_date as the minimum over release_country ∪ release_unknown_country, with its precision."
  - "An artist credit holds many artists (artist_count); a single artist key on a fact either explodes the grain or silently takes the first. Use dim_artist_credits and the bridge."
  - "A 7 GB download over a laptop connection fails mid-way; the fetch must resume (HTTP Range) and verify SHA256 before extracting, never trust a partial file."
  - "The tests run scripts through `sys.executable -I`, which ignores PEP 723 headers: every dependency a script imports must also be in pyproject.toml."
  - "Windows + PySpark: worker Python must be the uv-managed 3.11; set PYSPARK_PYTHON through the session builder, never through a global env var (journal in /spark-env)."


name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      # Spark 3.5 needs a JDK (8/11/17); the dbt tests start a local SparkSession.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: uv sync
      - run: uv run scripts/harness_guards.py
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run .claude/skills/warehouse-audit/audit_warehouse.py --offline
